[project]
name = "readmit-cohort-study"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "joblib>=1.4,<2",
  "numpy>=2.0,<3",
  "pandas>=2.2,<4",
  "pyarrow>=18,<24",
  "pyyaml>=6,<7",
  "scikit-learn>=1.5,<2",
]

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 92
target-version = "py311"
